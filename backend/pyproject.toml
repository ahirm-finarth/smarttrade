[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finarth-smart-trade"
version = "0.1.0"
description = "Smart Trade case and source document intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "pymysql>=1.1,<2", "cryptography>=44", "httpx>=0.28,<1", "openpyxl>=3.1,<4",
  "pymupdf>=1.26,<2", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
